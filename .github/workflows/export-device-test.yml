name: Real MP4 Export Device Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/export/**'
      - 'app/src/main/java/com/example/util/ExportDestination.kt'
      - 'app/src/androidTest/java/com/example/Mp4RenderExporterInstrumentedTest.kt'
      - '.github/workflows/export-device-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-smoke-test:
    name: Encode, decode, and inspect exported MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build files
        run: |
          cp -n .env.example .env || true
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real export smoke test on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: >-
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.example.Mp4RenderExporterInstrumentedTest
            --stacktrace

      - name: Surface instrumentation failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True)
          if not reports:
              print("::error title=Export device test failed::No Android test XML report was produced")
          for report in reports:
              try:
                  root = ET.parse(report).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  detail = (problem.get("message") or "") + "\n" + (problem.text or "")
                  detail = detail.strip()[:12000]
                  detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  name = case.get("name", "MP4 export smoke test")
                  print(f"::error title={name}::{detail}")
          PY

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mp4-export-device-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
