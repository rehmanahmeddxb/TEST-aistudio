name: Diagnose CI

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a07d3c-test-aistudio

permissions:
  contents: write

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Reproduce failure and capture logs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: true

      - name: Ensure Environment Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Run Unit Tests (captured)
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace > test-log.txt 2>&1

      - name: Build Release APK (captured)
        id: apk
        continue-on-error: true
        if: steps.tests.outcome == 'success'
        run: ./gradlew assembleRelease --stacktrace > apk-log.txt 2>&1

      - name: Build Release AAB (captured)
        id: aab
        continue-on-error: true
        if: steps.apk.outcome == 'success'
        run: ./gradlew bundleRelease --stacktrace > aab-log.txt 2>&1

      - name: Emit error summary
        if: always()
        run: |
          {
            for f in test-log.txt apk-log.txt aab-log.txt; do
              if [ -f "$f" ]; then
                echo "### $f — key lines"
                grep -nE "^e: |error: |FAILED|What went wrong|Caused by|Execution failed|Could not|Duplicate class" "$f" | head -60 || true
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY" || true
          # Surface the first few errors as annotations so they are visible via the API
          for f in test-log.txt apk-log.txt aab-log.txt; do
            if [ -f "$f" ]; then
              grep -E "^e: |error: |Execution failed|Duplicate class" "$f" | head -10 | while IFS= read -r line; do
                echo "::error title=$f::${line:0:400}"
              done
            fi
          done || true

      - name: Push diagnostics to side branch
        if: always()
        run: |
          mkdir -p diagnostics
          for f in test-log.txt apk-log.txt aab-log.txt; do
            [ -f "$f" ] && cp "$f" diagnostics/
          done
          if [ -d app/build/test-results ]; then
            cp -r app/build/test-results diagnostics/test-results || true
          fi
          if [ -d app/build/reports/tests ]; then
            cp -r app/build/reports/tests diagnostics/test-reports-html || true
          fi
          echo "diagnose run: ${{ github.run_id }} (job ${{ github.job }})" > diagnostics/RUN_INFO.txt
          git config user.name "arena-diagnostic-bot"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add diagnostics || true
          git commit -m "chore: capture CI diagnostics for run ${{ github.run_id }} [skip ci]" || echo "nothing to commit"
          git push origin HEAD:refs/heads/ci-diagnostics
