name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Environment Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      # Compile everything first so a compile error is reported as a compile error,
      # not buried inside a "tests failed" step.
      - name: Compile Sources & Tests
        run: ./gradlew compileDebugSources compileDebugUnitTestSources --stacktrace

      - name: Run Unit Tests & Roborazzi Screenshot Tests
        id: unit_tests
        # Keep going so the APK/AAB are still produced and uploaded even when a test fails.
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK (Minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release App Bundle (AAB)
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Roborazzi Screenshot Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: roborazzi-reports
          path: |
            app/build/reports/roborazzi/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release APK (Minified)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reaction-studio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release AAB
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reaction-studio-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Unit test summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.unit_tests.outcome }}" = "success" ]; then
            echo "✅ All unit / screenshot tests passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Unit / screenshot tests FAILED — see the \`unit-test-results\` artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Failed test cases" >> "$GITHUB_STEP_SUMMARY"
          found=0
          for f in $(grep -rl "<failure" app/build/test-results 2>/dev/null); do
            found=1
            echo "- \`$(basename "$f" .xml)\`" >> "$GITHUB_STEP_SUMMARY"
            grep -o '<failure message="[^"]*"' "$f" | head -5 | sed 's/<failure message="/    - /; s/"$//' >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" = "0" ]; then
            echo "_none_" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fail the job at the very end so the failure is still visible, but only after
      # every artifact (reports, APK, AAB) has been uploaded.
      - name: Fail if Unit Tests Failed
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed. Download the 'unit-test-results' artifact for details."
          exit 1

  build-release:
    name: Build Release (Optional)
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Decode Keystore (if secret provided)
        if: env.ENCODED_KEYSTORE != ''
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build Release APK & App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace || ./gradlew assembleRelease --stacktrace

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: reaction-studio-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
