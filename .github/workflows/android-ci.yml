name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Environment Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Run Unit Tests & Roborazzi Screenshot Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK (Minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release App Bundle (AAB)
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Roborazzi Screenshot Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-reports
          path: |
            app/build/reports/roborazzi/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release APK (Minified)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reaction-studio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reaction-studio-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

  build-release:
    name: Build Release (Optional)
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Decode Keystore (if secret provided)
        if: env.ENCODED_KEYSTORE != ''
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build Release APK & App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace || ./gradlew assembleRelease --stacktrace

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reaction-studio-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
